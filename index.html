<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Amazon Chatbot</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; background: #fff; height: 300px; overflow-y: auto; }
    .msg { margin-bottom: 10px; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>

  <h2>Amazon Order Chatbot</h2>
  <div id="chat"></div>

  <input type="text" id="userInput" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    function addMessage(text, sender) {
      const chat = document.getElementById("chat");
      const msg = document.createElement("div");
      msg.className = "msg " + sender;
      msg.textContent = sender === "user" ? "You: " + text : "Bot: " + text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");

      if (message.toLowerCase().includes("where is my order")) {
        const orderId = prompt("Please enter your order ID:");
        if (!orderId) {
          addMessage("Order ID not provided.", "bot");
          return;
        }

        try {
          const response = await fetch("http://127.0.0.1:5000/track_order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ order_id: orderId })
          });

          const data = await response.json();

          if (data.status === "success") {
            addMessage(`Tracking Number: ${data.tracking_number}\nEstimated Delivery: ${data.estimated_delivery}`, "bot");
          } else {
            addMessage(data.message || "Order not found.", "bot");
          }
        } catch (error) {
          addMessage("Error contacting server.", "bot");
        }
      } else {
        addMessage("Sorry, I didn't understand that.", "bot");
      }

      input.value = "";
    }
  </script>

</body>
</html>
